name: Checks

# develop deliberately triggers nothing: it is the working branch.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same action the four game repos use, minus the sibling checkout: this checkout already
      # IS hubbub, and on a non-main ref a second copy would be the wrong platform under test.
      # Keeping one action means the pnpm and node versions live in exactly one file.
      - uses: ./.github/actions/setup
        with:
          platform-checkout: "false"
          game-path: "."

      # With no sibling game repos on the runner, the install's postinstall regenerates the games
      # manifest down to the two core games and leaves the tree dirty. Nothing gates on that.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build
