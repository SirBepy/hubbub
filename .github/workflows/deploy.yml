name: deploy

# Manual only, and deliberately so: this is the one workflow holding a token that can read the
# private game repos, and workflow_dispatch cannot be fired by a fork PR.
on:
  workflow_dispatch:
    inputs:
      game-ref:
        description: "Branch to take each game from (main = released, develop = current work)"
        default: main
        type: string

# A second deploy landing mid-build would race the first onto the same worker.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One place for the two origins: the sandbox CSP bakes the shell/relay origin in at build
    # time, and the web build must point at the sandbox origin the same deploy publishes.
    env:
      SHELL_URL: https://hubbub.tabsxlabs.workers.dev
      SANDBOX_URL: https://hubbub-games.tabsxlabs.workers.dev
    steps:
      # The games are pinned with link: paths that point BOTH ways - games-manifest reaches out
      # to ../../../hubbub-game-*, and each game reaches back to ../hubbub/packages/*. So every
      # repo has to sit as a sibling under the workspace root, and the platform's directory has
      # to be named exactly "hubbub". Checking out to the default path breaks both directions.
      - uses: actions/checkout@v4
        with:
          path: hubbub

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: hubbub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hubbub/pnpm-lock.yaml

      # An installation token instead of a PAT: it is minted per run and expires in an hour, and
      # widening it to a new game repo is an App install setting rather than a token re-scope.
      # Requires the publishing App to be installed on the game repos with Contents: read.
      - uses: actions/create-github-app-token@v1
        id: games-token
        with:
          app-id: ${{ secrets.HUBBUB_APP_ID }}
          private-key: ${{ secrets.HUBBUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # External games sit in optionalDependencies, so the platform still installs on a machine
      # that has not cloned them - scan every bucket. A link: dep is only symlinked, so a game's
      # own deps resolve from its own node_modules, hence the per-game install. Unfrozen because
      # game repos gitignore their lockfile (the platform is a live sibling, not a pinned dep).
      - name: Check out and install linked games
        working-directory: hubbub
        env:
          GAMES_TOKEN: ${{ steps.games-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          GAME_REF: ${{ inputs.game-ref }}
        run: |
          git config --global url."https://x-access-token:${GAMES_TOKEN}@github.com/".insteadOf "https://github.com/"
          games=$(node -e "const p=require('./packages/games-manifest/package.json');const all=Object.assign({},p.dependencies,p.optionalDependencies,p.devDependencies);console.log(Object.values(all).filter(v=>typeof v==='string'&&v.startsWith('link:')).map(v=>v.split('/').pop()).join(' '))")
          if [ -z "$games" ]; then echo "::error::no link: games found in games-manifest"; exit 1; fi
          echo "linked games: $games"
          echo "LINKED_GAMES=$games" >> "$GITHUB_ENV"
          for g in $games; do
            echo "::group::$g"
            git clone --depth 1 --branch "${GAME_REF}" "https://github.com/${OWNER}/${g}.git" "${GITHUB_WORKSPACE}/${g}"
            pnpm --dir "${GITHUB_WORKSPACE}/${g}" install --no-frozen-lockfile
            echo "::endgroup::"
          done

      - name: Install platform deps
        run: pnpm install --frozen-lockfile
        working-directory: hubbub

      # The sandbox origin copies each game's dist/bundle.js, so the games build first. Their
      # own node_modules came from the per-game install above.
      - name: Build linked games
        working-directory: hubbub
        run: |
          for g in $LINKED_GAMES; do
            echo "::group::$g"
            pnpm --dir "${GITHUB_WORKSPACE}/${g}" build
            echo "::endgroup::"
          done

      - name: Build sandbox origin
        run: pnpm --filter @hubbub/sandbox-app build
        working-directory: hubbub
        env:
          HUBBUB_SHELL_ORIGIN: ${{ env.SHELL_URL }}
          HUBBUB_RELAY_ORIGIN: ${{ env.SHELL_URL }}

      # The build falls back to a localhost CSP when the origins are missing; shipping that would
      # make every game frame refuse to embed under the real shell.
      - name: Assert the sandbox CSP names the real shell
        working-directory: hubbub
        run: grep -F "frame-ancestors ${SHELL_URL}" apps/sandbox/dist/_headers

      - name: Build web
        run: pnpm --filter @hubbub/web build
        working-directory: hubbub
        env:
          VITE_SANDBOX_URL: ${{ env.SANDBOX_URL }}

      # Before the main worker: the shell would otherwise go live pointing at an origin that
      # does not exist yet.
      - name: Deploy sandbox worker
        run: pnpm --filter @hubbub/worker exec wrangler deploy -c ../sandbox/wrangler.jsonc
        working-directory: hubbub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler.jsonc serves its assets from ../web/dist, so the build above is what ships.
      - name: Deploy worker
        run: pnpm --filter @hubbub/worker exec wrangler deploy
        working-directory: hubbub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
