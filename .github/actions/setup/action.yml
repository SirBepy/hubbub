name: Hubbub setup
description: Installs a Hubbub repo with pnpm, optionally checking the platform out beside it first.

inputs:
  platform-ref:
    description: Branch or tag of SirBepy/hubbub to build the game against.
    required: false
    default: main
  game-path:
    description: Directory the calling workflow checked the repo out into.
    required: false
    default: game
  platform-checkout:
    description: >
      Fetch SirBepy/hubbub as a sibling. Leave true for game repos; set false in the platform's
      own workflow, where the checkout already IS hubbub and a second copy would be the wrong ref.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Games depend on the platform by relative path (file:../hubbub/packages/sdk), so the two
    # repos must sit side by side. actions/checkout refuses paths above the workspace, hence
    # both go UNDER it as siblings of each other rather than the game living at the root.
    - name: Check out the platform beside the game
      if: inputs.platform-checkout == 'true'
      uses: actions/checkout@v4
      with:
        repository: SirBepy/hubbub
        ref: ${{ inputs.platform-ref }}
        path: hubbub

    # Must precede setup-node: its pnpm cache shells out to `pnpm store path`.
    # No `version:` here on purpose: package.json's `packageManager` already pins it, and
    # action-setup treats being told twice as a hard error rather than a preference.
    # It has to be pointed at the PLATFORM's package.json, which is the only one in the estate
    # carrying `packageManager`; the default resolves to the workspace root, where a game repo's
    # checkout leaves nothing at all. One pinned pnpm for every repo, which is the whole point.
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ inputs.platform-checkout == 'true' && 'hubbub/package.json' || format('{0}/package.json', inputs.game-path) }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        # 22, not 20, and matching the root package.json engines floor: jsdom 30 pulls undici 8,
        # which calls worker_threads.markAsUncloneable - absent from every Node 20 including
        # 20.20.2, measured 2026-09-02. Nothing shipped needs a Node 22 global.
        node-version: 22
        cache: pnpm
        cache-dependency-path: ${{ inputs.game-path }}/package.json

    # No --frozen-lockfile on purpose: game repos gitignore their lockfile because the platform
    # is a live sibling rather than a versioned dependency, so a pinned lockfile would go stale
    # and fail CI on every platform change. Reproducibility comes from keeping built artifacts
    # (see the release pipeline spec), not from rebuilding a commit.
    - name: Install
      shell: bash
      working-directory: ${{ inputs.game-path }}
      run: pnpm install
