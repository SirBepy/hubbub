name: Hubbub setup
description: Installs a Hubbub repo with pnpm, optionally checking the platform out beside it first.

inputs:
  platform-ref:
    description: Branch or tag of SirBepy/hubbub to build the game against.
    required: false
    default: main
  game-path:
    description: Directory the calling workflow checked the repo out into.
    required: false
    default: game
  platform-checkout:
    description: >
      Fetch SirBepy/hubbub as a sibling. Leave true for game repos; set false in the platform's
      own workflow, where the checkout already IS hubbub and a second copy would be the wrong ref.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Games depend on the platform by relative path (link:../hubbub/packages/sdk), so the two
    # repos must sit side by side. actions/checkout refuses paths above the workspace, hence
    # both go UNDER it as siblings of each other rather than the game living at the root.
    - name: Check out the platform beside the game
      if: inputs.platform-checkout == 'true'
      uses: actions/checkout@v4
      with:
        repository: SirBepy/hubbub
        ref: ${{ inputs.platform-ref }}
        path: hubbub

    # Must precede setup-node: its pnpm cache shells out to `pnpm store path`.
    # Pointed at the PLATFORM's package.json, the estate's source of truth for `packageManager`;
    # the default resolves to the workspace root, which is not where a game repo is checked out.
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ inputs.platform-checkout == 'true' && 'hubbub/package.json' || format('{0}/package.json', inputs.game-path) }}

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        # 22, not 20, and matching the root package.json engines floor: jsdom 30 pulls undici 8,
        # which calls worker_threads.markAsUncloneable - absent from every Node 20 including
        # 20.20.2, measured 2026-09-02. Nothing shipped needs a Node 22 global.
        node-version: 22
        cache: pnpm
        cache-dependency-path: |
          ${{ inputs.game-path }}/package.json
          ${{ inputs.platform-checkout == 'true' && 'hubbub/pnpm-lock.yaml' || format('{0}/package.json', inputs.game-path) }}

    # CI already runs the platform's pnpm whatever the game pins, so this guards the LOCAL loop: a
    # game repo's own pin is what `corepack pnpm` resolves there, and it must not drift.
    - name: Check the game pins the platform's pnpm
      if: inputs.platform-checkout == 'true'
      shell: bash
      run: node "${{ github.action_path }}/check-package-manager.mjs" hubbub/package.json "${{ inputs.game-path }}/package.json"

    # A link: package is a symlink into ../hubbub/packages/*, so tsc and Vite resolve the
    # platform's own imports (zod, react, @hubbub/protocol) from hubbub/node_modules. Without this
    # install that tree is empty and every game typecheck fails inside the platform's sources.
    - name: Install the platform
      if: inputs.platform-checkout == 'true'
      shell: bash
      working-directory: hubbub
      run: pnpm install --frozen-lockfile

    # Game repos commit pnpm-lock.yaml as their only dependency pin; a floating caret once resolved
    # to an unpublished vitest sibling and broke installs. The @hubbub/* entries are link: paths,
    # so platform changes never stale the lock. A branch that predates the tracked lock still
    # installs unfrozen until it is promoted.
    - name: Install
      shell: bash
      working-directory: ${{ inputs.game-path }}
      run: |
        if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
